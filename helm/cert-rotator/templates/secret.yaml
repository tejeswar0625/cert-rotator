{{- if .Values.config.notifications.smtp.enabled }}
{{- if not .Values.config.notifications.smtp.secretRef }}
# Auto-generated placeholder Secret for SMTP.
# Populate this with real credentials or set config.notifications.smtp.secretRef
# to point to an existing Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cert-rotator-smtp
  namespace: {{ include "cert-rotator.namespace" . }}
  labels:
    {{- include "cert-rotator.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: ""
  to: ""
{{- end }}
{{- end }}
---
{{- if .Values.config.notifications.slack.enabled }}
{{- if not .Values.config.notifications.slack.secretRef }}
# Auto-generated placeholder Secret for Slack webhook.
# Populate this with the real webhook URL or set config.notifications.slack.secretRef
# to point to an existing Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cert-rotator-slack
  namespace: {{ include "cert-rotator.namespace" . }}
  labels:
    {{- include "cert-rotator.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook_url: ""
{{- end }}
{{- end }}