apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-rotator
  namespace: cert-rotator-system
  labels:
    app.kubernetes.io/name: cert-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-rotator
  labels:
    app.kubernetes.io/name: cert-rotator
rules:
  # Full access to the CertRotationConfig CRD
  - apiGroups: ["cert-rotator.tejeswar0625.dev"]
    resources: ["certrotationconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-rotator.tejeswar0625.dev"]
    resources: ["certrotationconfigs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cert-rotator.tejeswar0625.dev"]
    resources: ["certrotationconfigs/finalizers"]
    verbs: ["update"]
  # Read Secrets for SMTP and Slack webhook credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Emit Events for observability
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Read Node objects — useful for node metadata and status
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-rotator
  labels:
    app.kubernetes.io/name: cert-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-rotator
subjects:
  - kind: ServiceAccount
    name: cert-rotator
    namespace: cert-rotator-system