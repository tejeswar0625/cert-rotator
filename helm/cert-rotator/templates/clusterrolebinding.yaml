apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-rotator.fullname" . }}
  labels:
    {{- include "cert-rotator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-rotator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-rotator.serviceAccountName" . }}
    namespace: {{ include "cert-rotator.namespace" . }}